name: Game Module CI

# Se ejecuta cuando hay cambios en el módulo Game
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'HabitApp/HabitApp/Features/Game/**'
      - 'HabitApp/HabitApp/Infraestructure/Plugins/**'
  pull_request:
    paths:
      - 'HabitApp/HabitApp/Features/Game/**'
      - 'HabitApp/HabitApp/Infraestructure/Plugins/**'
  workflow_dispatch:

jobs:
  validate-game-module:
    name: Validar Módulo Game
    runs-on: macos-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Seleccionar Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Verificar versión de Swift
        run: swift --version

      - name: Listar archivos del módulo Game
        run: |
          echo "📁 Estructura del módulo Game:"
          find HabitApp/HabitApp/Features/Game -type f -name "*.swift" | sort

      - name: Validar sintaxis Swift del módulo
        run: |
          echo "🔍 Validando sintaxis de archivos Swift..."
          for file in HabitApp/HabitApp/Features/Game/**/*.swift; do
            if [ -f "$file" ]; then
              echo "Verificando: $file"
              xcrun swift -frontend -parse "$file" || exit 1
            fi
          done

      - name: Compilar target App-Plugin-Juego (macOS)
        working-directory: HabitApp
        run: |
          echo "🔨 Compilando target App-Plugin-Juego (macOS)..."
          xcodebuild \
            -project HabitApp.xcodeproj \
            -scheme App-Plugin-Juego \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean build | xcpretty || true

      - name: Compilar target App-Plugin-Juego (iOS)
        working-directory: HabitApp
        run: |
          echo "🔨 Compilando target App-Plugin-Juego (iOS)..."
          xcodebuild \
            -project HabitApp.xcodeproj \
            -scheme App-Plugin-Juego \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build | xcpretty || true

      - name: Verificar protocolo ViewPlugin
        run: |
          echo "🔌 Verificando implementación de ViewPlugin..."
          grep -n "ViewPlugin" HabitApp/HabitApp/Features/Game/GamePlugin.swift || echo "⚠️ ViewPlugin no encontrado"

      - name: Verificar protocolo DataPlugin
        run: |
          echo "💾 Verificando implementación de DataPlugin..."
          grep -n "DataPlugin" HabitApp/HabitApp/Features/Game/GamePlugin.swift || echo "⚠️ DataPlugin no encontrado"

      - name: Análisis de componentes del módulo
        run: |
          echo "📊 Análisis del módulo Game:"
          echo "----------------------------------------"
          echo "Modelos:"
          find HabitApp/HabitApp/Features/Game/Models -name "*.swift" -exec basename {} \; 2>/dev/null || echo "Sin modelos"
          echo "----------------------------------------"
          echo "ViewModels:"
          find HabitApp/HabitApp/Features/Game/ViewModels -name "*.swift" -exec basename {} \; 2>/dev/null || echo "Sin ViewModels"
          echo "----------------------------------------"
          echo "Views:"
          find HabitApp/HabitApp/Features/Game/Views -name "*.swift" -exec basename {} \; 2>/dev/null || echo "Sin Views"
          echo "----------------------------------------"
          echo "Storage:"
          find HabitApp/HabitApp/Features/Game/Storage -name "*.swift" -exec basename {} \; 2>/dev/null || echo "Sin Storage"

      - name: Verificar dependencias del plugin
        run: |
          echo "🔗 Verificando dependencias..."
          grep -n "import" HabitApp/HabitApp/Features/Game/GamePlugin.swift | head -20

      - name: Resumen de validación
        if: success()
        run: |
          echo "✅ Módulo Game validado exitosamente"
          echo "✅ Sintaxis correcta"
          echo "✅ Compilación exitosa en App-Plugin-Juego (macOS e iOS)"
          echo "✅ Protocolos de plugins implementados"

      - name: Reportar errores
        if: failure()
        run: |
          echo "❌ La validación del módulo Game falló"
          echo "Por favor revisa los logs anteriores para más detalles"
