name: SwiftUI Multiplatform Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # -------- macOS --------
      - name: Build AppCore (macOS)
        run: |
          xcodebuild \
            -project HabitApp.xcodeproj \
            -scheme AppCore \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build AppFull (macOS)
        run: |
          xcodebuild \
            -project HabitApp.xcodeproj \
            -scheme AppFull \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      # -------- iOS --------
      - name: Build AppCore (iOS)
        run: |
          xcodebuild \
            -project HabitApp.xcodeproj \
            -scheme AppCore \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build AppFull (iOS)
        run: |
          xcodebuild \
            -project HabitApp.xcodeproj \
            -scheme AppFull \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            clean build
